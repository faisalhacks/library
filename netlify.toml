# Tells Netlify how to build this Next.js app.
# The Supabase URL and key are NOT here: add them in Netlify under
# Project configuration -> Environment variables.

[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  # Next.js 16 needs Node 20.9 or newer.
  NODE_VERSION = "22"
  # The Supabase anon key is public by design (it ships to the browser and
  # access is enforced by row-level security), so skip it in secret scanning.
  SECRETS_SCAN_OMIT_KEYS = "NEXT_PUBLIC_SUPABASE_ANON_KEY"

# Netlify's Next.js runtime: turns the build into server functions so pages,
# proxy.ts (auth redirects) and API routes work. Without it only static files
# are uploaded and every page returns 404.
[[plugins]]
  package = "@netlify/plugin-nextjs"
